<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SGVISUALZ – An elegant infinite scroll parallax experience showcasing graduation photography with smooth animations and modern web techniques." />
  <meta name="theme-color" content="#000000" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SGVISUALZ – Infinite Scroll Parallax" />
  <meta property="og:description" content="Explore stunning graduation photography with infinite scroll and parallax effects." />
  <meta property="og:image" content="assets/images/svisualz-logo.png" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="SGVISUALZ – Infinite Scroll Parallax" />
  <meta property="twitter:description" content="Explore stunning graduation photography with infinite scroll and parallax effects." />
  <meta property="twitter:image" content="assets/images/svisualz-logo.png" />
  
  <title>SGVISUALZ – Infinite Scroll Parallax</title>
  <link rel="icon" type="image/png" href="assets/images/svisualz-logo.png" />

  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="styles.css" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lenis -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.27/bundled/lenis.min.js"></script>
</head>

<body>
  <div class="wrapper">
    <div class="content">

      <!-- GRADUATION SET 1 -->
      <section class="section"><div class="image-container"><img src="assets/images/g1.JPG" alt="Graduation Photo 1" loading="lazy" /></div></section>

      <section class="section"><div class="image-container"><img src="assets/images/g5.JPG" alt="Graduation Photo 5" loading="lazy" /></div></section>

      <!-- GRADUATION SET 2 -->
      <section class="section"><div class="image-container"><img src="assets/images/DSC06442.JPG" alt="Graduation Photo 6" loading="lazy" /></div></section>
      <section class="section"><div class="image-container"><img src="assets/images/DSC06470.JPG" alt="Graduation Photo 7" loading="lazy" /></div></section>

      <section class="section"><div class="image-container"><img src="assets/images/DSC06595.JPG" alt="Graduation Photo 13" loading="lazy" /></div></section>

      <!-- LOOP BACK TO FIRST IMAGE -->
      <section class="section" aria-hidden="true">
        <div class="image-container"><img src="assets/images/g1.JPG" alt="Graduation Photo Loop" /></div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
