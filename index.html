<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGVISUALZ – Infinite Scroll Parallax</title>

  <link rel="stylesheet" href="assets/reset.css" />
  <link rel="stylesheet" href="styles.css" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lenis Smooth Scroll -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.27/bundled/lenis.min.js"></script>
</head>

<body>
  <div class="wrapper">
    <div class="content">

      <!-- SECTION 1 -->
      <section class="hero">
        <picture>
          <img src="assets/images/grad-1.jpg" alt="Grad 1" />
        </picture>
      </section>

      <!-- SECTION 2 -->
      <section class="hero">
        <picture>
          <img src="assets/images/grad-2.jpg" alt="Grad 2" />
        </picture>
      </section>

      <!-- SECTION 3 -->
      <section class="hero">
        <picture>
          <img src="assets/images/grad-3.jpg" alt="Grad 3" />
        </picture>
      </section>

      <!-- LOGO SECTION -->
      <section class="hero">
        <img class="logo" src="assets/images/sgvisualz-logo.png" alt="SGVISUALZ Logo" />
      </section>

      <!-- LOOP BACK TO FIRST IMAGE -->
      <section class="hero" aria-hidden="true">
        <picture>
          <img src="assets/images/grad-1.jpg" alt="" />
        </picture>
      </section>

    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
